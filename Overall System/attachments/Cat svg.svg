<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Body -->
  <ellipse cx="100" cy="130" rx="50" ry="60" fill="#c49e8f" />
  
  <!-- Head -->
  <circle cx="100" cy="70" r="35" fill="#c49e8f" />
  
  <!-- Ears -->
  <polygon points="70,50 85,25 100,50" fill="#c49e8f" />
  <polygon points="130,50 115,25 100,50" fill="#c49e8f" />
  
  <!-- Eyes -->
  <circle cx="85" cy="65" r="6" fill="#000" />
  <circle cx="115" cy="65" r="6" fill="#000" />
  
  <!-- Nose -->
  <polygon points="98,78 102,78 100,83" fill="#ff6666" />
  
  <!-- Mouth -->
  <path d="M95,85 Q100,90 105,85" stroke="#000" stroke-width="1" fill="transparent" />
  
  <!-- Tail -->
  <path d="M150,140 Q180,120 170,160" stroke="#c49e8f" stroke-width="12" fill="none" stroke-linecap="round" />
  
  <!-- Whiskers -->
  <line x1="75" y1="78" x2="55" y2="76" stroke="#000" stroke-width="1" />
  <line x1="75" y1="82" x2="55" y2="84" stroke="#000" stroke-width="1" />
  <line x1="125" y1="78" x2="145" y2="76" stroke="#000" stroke-width="1" />
  <line x1="125" y1="82" x2="145" y2="84" stroke="#000" stroke-width="1" />
</svg>